name: Go Build

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    name: Go Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Build Go binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p bin
          go build -v -o "bin/open-etc-pool-${{ matrix.goos }}-${{ matrix.goarch }}" .

      - name: Upload compiled binary
        uses: actions/upload-artifact@v4
        with:
          name: open-etc-pool-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/open-etc-pool-${{ matrix.goos }}-${{ matrix.goarch }}
          retention-days: 7
